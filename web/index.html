    /* The loading spine. Here rather than styles.css so it paints before anything else has loaded. */
    #boot { position: fixed; inset: 0; z-index: 9999; background: #0d0d0f; transition: opacity .5s cubic-bezier(.4, 0, .2, 1); animation: boot-giveup .4s 10s forwards; }
    #boot.out { opacity: 0; pointer-events: none; }
    /* The launch screen's image fills the screen's longer side, and the logo is 520/2732 of it */
    .boot-spine { position: absolute; left: 50%; top: 50%; width: 19.033vmax; height: 19.033vmax; margin: -9.5165vmax; transition: transform .6s cubic-bezier(.2, .7, .2, 1); }
    #boot.out .boot-spine { transform: scale(1.07); }
    .boot-spine svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; fill: none; stroke: url(#boot-spine); stroke-linecap: round; stroke-width: 42; will-change: transform; animation: boot-sway 1.5s calc(120ms + var(--i) * 16ms) infinite; }
    .boot-spine .boot-glow, .boot-spine .boot-soft { will-change: opacity; }
    .boot-spine .boot-glow { animation: boot-breathe 1.5s 120ms ease-in-out infinite; }
    .boot-spine .boot-soft { animation: boot-settle .3s 120ms ease-out forwards; }
    /* From the base up, each piece leans one way then the other, and the whole length lifts a little */
    @keyframes boot-sway {
      0%, 100% { transform: translate3d(0, 0, 0); animation-timing-function: cubic-bezier(.37, 0, .63, 1); }
      25% { transform: translate3d(calc(var(--a) * 1%), calc(var(--b) * -1%), 0); animation-timing-function: cubic-bezier(.37, 0, .63, 1); }
      75% { transform: translate3d(calc(var(--a) * -1%), calc(var(--b) * -.4%), 0); animation-timing-function: cubic-bezier(.37, 0, .63, 1); }
    }
    @keyframes boot-breathe { 50% { opacity: .65; } }
    @keyframes boot-settle { to { opacity: 0; } }
    /* If the app ever failed to start, don't leave the spine up forever */
    @keyframes boot-giveup { to { opacity: 0; visibility: hidden; } }
    @media (prefers-reduced-motion: reduce) { .boot-spine svg { animation: none !important; } }
