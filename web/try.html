<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; frame-src 'self'; img-src 'self'; style-src 'unsafe-inline'; font-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Try Back Story</title>
  <link rel="icon" href="icons/favicon-32.png">
  <script src="site.js"></script>
  <script src="try.js" defer></script>
  <style>
    @font-face { font-family: 'Italiana'; src: url('assets/fonts/italiana.woff2') format('woff2'); font-display: swap; }
    @font-face { font-family: 'Outfit'; src: url('assets/fonts/outfit.woff2') format('woff2'); font-weight: 100 900; font-display: swap; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; background: #0d0d0f; color: #f5f5f7; font: 17px/1.5 Outfit, -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; gap: 72px; padding: 24px; overflow: hidden; }
    .glow { position: fixed; inset: -20% -10% auto; height: 70%; z-index: -1; filter: blur(60px); opacity: .55; background: radial-gradient(40% 50% at 30% 40%, rgba(236, 78, 52, .55), transparent 70%), radial-gradient(45% 55% at 55% 25%, rgba(30, 44, 112, .8), transparent 70%); }
    .copy { width: 300px; flex: none; }
    h1 { font-family: 'Italiana', serif; font-size: 44px; font-weight: 400; -webkit-text-stroke: 0.4px currentColor; line-height: 1.1; margin: 0 0 14px; }
    p { color: rgba(235, 235, 245, .62); font-weight: 300; margin: 0 0 16px; }
    a { color: #f5f5f7; }
    /* A phone drawn around the app: a black bezel inside a thin metal edge, a status bar and a home bar, with the
       app laid out at a real iPhone's width (402 points) and scaled to fit, as it would look in the hand */
    .phone { flex: none; position: relative; height: min(calc(100vh - 48px), 880px); aspect-ratio: 430 / 902; padding: 13px; border-radius: 68px; background: #0b0b0c; box-shadow: 0 0 0 2px #3a3a3e, 0 0 0 3px #1b1b1e, 0 60px 120px -40px #000; }
    .screen { position: relative; width: 100%; height: 100%; border-radius: 55px; overflow: hidden; background: var(--app-bg, #0d0d0f); }
    .device { position: absolute; left: 0; top: 0; width: 402px; height: 874px; transform-origin: 0 0; }
    .status { position: absolute; inset: 0 0 auto; height: 54px; display: flex; align-items: center; justify-content: space-between; padding: 6px 30px 0 46px; font: 600 17px/1 -apple-system, 'SF Pro Text', Outfit, sans-serif; color: var(--app-ink, #fff); }
    .status svg { height: 13px; width: auto; fill: currentColor; }
    .status .icons { display: flex; gap: 6px; align-items: center; }
    .island { position: absolute; left: 50%; top: 11px; width: 124px; height: 36px; margin-left: -62px; border-radius: 20px; background: #000; }
    .device iframe { position: absolute; left: 0; top: 54px; width: 402px; height: 786px; border: 0; background: var(--app-bg, #0d0d0f); }
    .home { position: absolute; left: 50%; bottom: 8px; width: 140px; height: 5px; margin-left: -70px; border-radius: 3px; background: var(--app-ink, #fff); opacity: .9; }
    .phone[data-app="light"] { --app-bg: #efebe6; --app-ink: #000; }
    .phone[data-app="dark"] { --app-bg: #0d0d0f; --app-ink: #fff; }
    /* Light, when picked on the marketing page or the device is set to it */
    :root[data-theme="light"] body { background: #efeeec; color: #1d1c1f; }
    :root[data-theme="light"] p { color: rgba(29, 28, 31, .62); }
    :root[data-theme="light"] a { color: #1d1c1f; }
    :root[data-theme="light"] .glow { opacity: .35; }
    :root[data-theme="light"] .phone { box-shadow: 0 0 0 2px #c9c6c2, 0 0 0 3px #e6e3df, 0 60px 120px -50px rgba(40, 42, 52, .45); }
    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]) body { background: #efeeec; color: #1d1c1f; }
      :root:not([data-theme="dark"]) p { color: rgba(29, 28, 31, .62); }
      :root:not([data-theme="dark"]) a { color: #1d1c1f; }
      :root:not([data-theme="dark"]) .glow { opacity: .35; }
      :root:not([data-theme="dark"]) .phone { box-shadow: 0 0 0 2px #c9c6c2, 0 0 0 3px #e6e3df, 0 60px 120px -50px rgba(40, 42, 52, .45); }
    }
    @media (max-width: 860px) { .copy { display: none; } }
    /* On a phone or tablet there's no frame: the app fills the browser */
    @media (max-width: 759px), (pointer: coarse) {
      body { display: block; padding: 0; }
      .glow, .copy, .status, .island, .home { display: none; }
      .phone, .screen { width: 100%; height: 100dvh; aspect-ratio: auto; padding: 0; border-radius: 0; box-shadow: none; background: none; }
      .device { position: static; width: 100%; height: 100%; transform: none !important; }
      .device iframe { position: static; width: 100%; height: 100%; }
    }
  </style>
</head>
<body>
  <div class="glow"></div>
  <div class="copy">
    <h1>Back Story</h1>
    <p>Back Story is built for your phone, so here it is in one.</p>
    <p><a href="about.html">About the app</a></p>
  </div>
  <div class="phone"><div class="screen"><div class="device">
    <div class="status" aria-hidden="true">
      <span>9:41</span>
      <span class="icons">
        <svg viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
        <svg viewBox="0 0 16 12"><path d="M8 2.6c2.3 0 4.4.9 6 2.4l1.3-1.4C13.3 1.7 10.8.6 8 .6S2.7 1.7.7 3.6L2 5c1.6-1.5 3.7-2.4 6-2.4Zm0 3.8c1.3 0 2.5.5 3.4 1.3l1.3-1.4C11.5 5.2 9.8 4.4 8 4.4s-3.5.8-4.7 1.9L4.6 7.7C5.5 6.9 6.7 6.4 8 6.4Zm0 3.8c.5 0 .9.2 1.2.5L8 12l-1.2-1.3c.3-.3.7-.5 1.2-.5Z"/></svg>
        <svg viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="20" height="9" rx="2"/><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2Z" opacity=".4"/></svg>
      </span>
    </div>
    <span class="island" aria-hidden="true"></span>
    <iframe src="./" title="Back Story"></iframe>
    <span class="home" aria-hidden="true"></span>
  </div></div></div>
</body>
</html>
