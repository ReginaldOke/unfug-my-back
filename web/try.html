<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; frame-src 'self'; img-src 'self'; style-src 'unsafe-inline'; font-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Try Back Story</title>
  <link rel="icon" href="icons/favicon-32.png">
  <style>
    @font-face { font-family: 'Italiana'; src: url('assets/fonts/italiana.woff2') format('woff2'); font-display: swap; }
    @font-face { font-family: 'Outfit'; src: url('assets/fonts/outfit.woff2') format('woff2'); font-weight: 100 900; font-display: swap; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; background: #0d0d0f; color: #f5f5f7; font: 17px/1.5 Outfit, -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; gap: 72px; padding: 24px; overflow: hidden; }
    .glow { position: fixed; inset: -20% -10% auto; height: 70%; z-index: -1; filter: blur(60px); opacity: .55; background: radial-gradient(40% 50% at 30% 40%, rgba(236, 78, 52, .55), transparent 70%), radial-gradient(45% 55% at 55% 25%, rgba(30, 44, 112, .8), transparent 70%); }
    .copy { width: 300px; flex: none; }
    h1 { font-family: 'Italiana', serif; font-size: 44px; font-weight: 400; -webkit-text-stroke: 0.4px currentColor; line-height: 1.1; margin: 0 0 14px; }
    p { color: rgba(235, 235, 245, .62); font-weight: 300; margin: 0 0 16px; }
    a { color: #f5f5f7; }
    .phone { flex: none; height: min(calc(100vh - 48px), 844px); aspect-ratio: 390 / 844; padding: 10px; border-radius: 54px; background: #1b1b1e; border: 1px solid rgba(255, 255, 255, .14); box-shadow: 0 50px 120px -40px #000; }
    iframe { display: block; width: 100%; height: 100%; border: 0; border-radius: 44px; background: #0d0d0f; }
    @media (max-width: 860px) { .copy { display: none; } }
    /* On a phone or tablet there's no frame: the app fills the browser */
    @media (max-width: 759px), (pointer: coarse) {
      body { display: block; padding: 0; }
      .glow, .copy { display: none; }
      .phone { width: 100%; height: 100dvh; aspect-ratio: auto; padding: 0; border: 0; border-radius: 0; box-shadow: none; background: none; }
      iframe { border-radius: 0; }
    }
  </style>
</head>
<body>
  <div class="glow"></div>
  <div class="copy">
    <h1>Back Story</h1>
    <p>Back Story is built for your phone, so here it is in one. Anything you enter stays in this browser.</p>
    <p><a href="about.html">About the app</a></p>
  </div>
  <div class="phone"><iframe src="./" title="Back Story"></iframe></div>
</body>
</html>
